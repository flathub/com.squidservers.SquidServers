app-id: com.squidservers.SquidServers
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: squidservers
separate-locales: false
rename-desktop-file: squidservers.desktop
rename-icon: squidservers

finish-args:
  # Network access for Minecraft servers, auth, modpack downloads, and tunnels
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Filesystem permissions for server directories, world backups, and downloads
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=/media:ro
  - --filesystem=/run/media:ro

modules:
  - name: unappimage
    buildsystem: simple
    build-options:
      cflags: "-std=gnu89"
    build-commands:
      - make -C squashfs-tools install INSTALL_DIR=/app/bin
    sources:
      - type: git
        url: https://github.com/refi64/unappimage
        commit: d7f86f2a0d7ec3a69211125207d5f127386b849a
    cleanup:
      - "*"

  - name: squidservers
    buildsystem: simple
    build-commands:
      - unappimage squidservers.AppImage
      - mv squashfs-root /app/squidservers
      - install -Dm755 squidservers.sh /app/bin/squidservers
      # Desktop entry, icon and AppStream metainfo
      - install -Dm644 /app/squidservers/squidservers.desktop -t /app/share/applications/
      - desktop-file-edit --set-key=Exec --set-value='squidservers %U' /app/share/applications/squidservers.desktop
      - install -Dm644 com.squidservers.SquidServers.png /app/share/icons/hicolor/512x512/apps/squidservers.png
      - install -Dm644 com.squidservers.SquidServers.metainfo.xml /app/share/metainfo/com.squidservers.SquidServers.metainfo.xml
    sources:
      - type: file
        path: com.squidservers.SquidServers.png
      - type: file
        path: com.squidservers.SquidServers.metainfo.xml
      - type: file
        dest-filename: squidservers.AppImage
        only-arches: [x86_64]
        url: https://cdn.squidservers.com/squidservers-0.10.4-x86_64.AppImage
        sha256: 4e0d976fcd51c198cb0fd698048ac3ae2111cd855a983839baee3156b24167ce
        x-checker-data:
          type: electron-updater
          url: https://cdn.squidservers.com/latest-linux.yml
      - type: file
        dest-filename: squidservers.AppImage
        only-arches: [aarch64]
        url: https://cdn.squidservers.com/squidservers-0.10.4-arm64.AppImage
        sha256: bd4429bfcff3b621088b496da1b95609323a707708f29b52cfa205a5a1334b9b
        x-checker-data:
          type: electron-updater
          url: https://cdn.squidservers.com/latest-linux-arm64.yml
      - type: script
        dest-filename: squidservers.sh
        commands:
          - exec zypak-wrapper.sh /app/squidservers/squidservers "$@"
